18 -19 -65 -21 -82 -4 -16 16 -16 70 0 86 17 17 64 15 82 -4z m-314 -136 c24 -26 25 -37 4 -66 -29 -42 -104 -22 -104 28 0 57 60 80 100 38z"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="280" y="150" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1">Datalake Studio</text>
    <text x="282" y="198" fill="#9fdcc9" font-size="28" font-weight="600">From raw data to ready-to-use APIs</text>

    <!-- Load → Query → Visualise → Publish -->
    <path d="M150 300 H1130" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 8"/>
    <g font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">
      <g transform="translate(240 300)">
        <rect x="-96" y="-28" width="192" height="56" rx="28" fill="#17211f" stroke="#3f8f7c" stroke-width="2"/>
        <text y="8">Load</text>
      </g>
      <g transform="translate(493 300)">
        <rect x="-96" y="-28" width="192" height="56" rx="28" fill="#17211f" stroke="#3f8f7c" stroke-width="2"/>
        <text y="8">Query</text>
      </g>
      <g transform="translate(746 300)">
        <rect x="-96" y="-28" width="192" height="56" rx="28" fill="#17211f" stroke="#3f8f7c" stroke-width="2"/>
        <text y="8">Visualise</text>
      </g>
      <g transform="translate(1000 300)">
        <rect x="-96" y="-28" width="192" height="56" rx="28" fill="#0d846f" stroke="#2fb594" stroke-width="2"/>
        <text y="8">Publish API</text>
      </g>
    </g>
    <g font-size="15" fill="#b9c8c3" text-anchor="middle">
      <text x="240" y="356">CSV · Parquet · JSON · S3 · Postgres</text>
      <text x="493" y="356">SQL on DuckDB · AI assistant</text>
      <text x="746" y="356">Charts · cross-filters · H3 maps</text>
      <text x="1000" y="356">Parameterised REST endpoints</text>
    </g>
    <text x="1196" y="64" fill="#b9c8c3" font-size="16" text-anchor="end" letter-spacing="1">OPEN SOURCE · POWERED BY DUCKDB</text>
  </g>
</svg>
