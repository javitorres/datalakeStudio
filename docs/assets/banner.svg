<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Datalake Studio</title>
  <desc id="d">From raw data to ready-to-use APIs: load, query, visualise and publish your data. Open source, powered by DuckDB.</desc>
  <defs>
    <radialGradient id="glow" cx="30%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1f4a40"/>
      <stop offset="0.65" stop-color="#17211f"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#0d846f" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#2fb594"/>
      <stop offset="1" stop-color="#0d846f" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Hexagon tiling, a nod to the H3 maps -->
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="translate(820 -10)">
      <path d="M28 0 L56 16.2 L56 48.5 L28 64.7 L0 48.5 L0 16.2 Z M0 64.7 L0 97 M56 64.7 L56 97" fill="none" stroke="#9fdcc9" stroke-width="1"/>
    </pattern>
    <linearGradient id="hexfade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="hexmask"><rect x="720" width="560" height="400" fill="url(#hexfade)"/></mask>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#glow)"/>
    <rect width="1280" height="400" fill="url(#hex)" opacity="0.13" mask="url(#hexmask)"/>
  </g>

  <!-- Logo mark (client/src/assets/logo.svg) -->
  <g transform="translate(84 92) scale(1.25)">
    <g transform="translate(0 126) scale(0.1 -0.1)" fill="#9fdcc9">
