# Server port
port: 8000
# Folder where user databases are stored
databasesFolder: "data"
# Default database name for new users
defaultDatabase: "datalakeStudio.db"
# Temporary folder for file uploads and exports
downloadFolder: "temp"
# Enable login/registration (true) or allow anonymous access as "default" user (false)
authEnabled: false
# Confine each user's SQL to their own folders and the remote prefixes below (default: same as authEnabled)
# sandboxEnabled: true
# Remote locations sandboxed SQL can reach besides the user's folders (default: https:// and s3://)
# sandboxAllowedPrefixes:
#   - "https://"
#   - "s3://"
# DuckDB resources per open database (each one is its own DuckDB instance). With authEnabled and no
# memory limit, DuckDB's default (80% of the RAM) is split among duckdbMaxOpenDatabases.
# duckdbMemoryLimit: "4GB"
# duckdbThreads: 4
# Databases open at once (beyond it the least recently used is closed) and idle minutes before closing one
# duckdbMaxOpenDatabases: 8
# duckdbIdleMinutes: 30
# Origins allowed for app endpoints (not applied to /api/*)
allowedOrigins:
  - "http://localhost:8080"